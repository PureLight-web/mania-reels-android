name: Build Mania Reels APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' -print -quit)")
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  maven("https://maven-central.storage-download.googleapis.com/maven2")
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  maven("https://maven-central.storage-download.googleapis.com/maven2")
                  mavenCentral()
              }
          }
          rootProject.name = "ManiaReels"
          include(":app")
          EOF
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk_out/ManiaReels-v1.1.apk"

      - name: Upload ManiaReels-v1.1.apk
        uses: actions/upload-artifact@v4
        with:
          name: ManiaReels-v1.1-apk
          path: apk_out/ManiaReels-v1.1.apk
